name: awan_cash
description: "Awan Cash - aplikasi pencatatan keuangan pribadi, 100% offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Format angka & tanggal (versi mengikuti flutter_localizations)
  intl: any

  # Database lokal SQLite
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Keamanan: hash PIN & biometrik
  crypto: ^3.0.6
  local_auth: ">=2.3.0 <4.0.0"

  # Foto struk
  image_picker: ^1.1.2

  # Ekspor, berbagi file, dan pemulihan cadangan
  excel: ^4.0.6
  share_plus: ^11.0.0
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
